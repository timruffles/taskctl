name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/*/go.mod
      - name: Test taskctl
        run: go test -race -count=1 -timeout=15m ./...
      - name: Test example projects
        run: |
          for module in examples/ledger examples/textstats; do
            (cd "$module" && go test -race -count=1 -timeout=5m ./...)
          done
      - name: Vet all modules
        run: |
          go vet ./...
          for module in examples/ledger examples/textstats; do
            (cd "$module" && go vet ./...)
          done

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and package
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go mod vendor
          mkdir -p dist
          flags="-s -w"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            flags="$flags -X main.version=${GITHUB_REF_NAME#v}"
          fi
          go build -mod=vendor -buildvcs=false -trimpath -ldflags="$flags" -o dist/taskctl ./cmd/taskctl
          cp LICENSE dist/
          (
            cd vendor
            find . -type f \
              \( -iname 'license*' -o -iname 'notice*' -o -iname 'copying*' -o -iname 'patents*' \) \
              | LC_ALL=C sort | while IFS= read -r file; do
                printf '\n===== %s =====\n' "$file"
                cat "$file"
              done
          ) > dist/THIRD_PARTY_NOTICES
          tar -czf "taskctl-${GOOS}-${GOARCH}.tar.gz" -C dist taskctl LICENSE THIRD_PARTY_NOTICES
      - name: Package corresponding source
        if: github.ref_type == 'tag' && matrix.goos == 'linux'
        run: |
          mkdir -p dist/source
          git archive HEAD | tar -xf - -C dist/source
          cp -R vendor dist/source/
          tar -czf taskctl-source.tar.gz -C dist/source .
      - name: Upload corresponding source
        if: github.ref_type == 'tag' && matrix.goos == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: taskctl-source.tar.gz
          archive: false
          if-no-files-found: error
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: taskctl-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: taskctl-*.tar.gz
          merge-multiple: true
          path: release
      - name: Publish binaries and matching source
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum taskctl-darwin-arm64.tar.gz taskctl-linux-amd64.tar.gz taskctl-source.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            taskctl-darwin-arm64.tar.gz taskctl-linux-amd64.tar.gz taskctl-source.tar.gz SHA256SUMS
