name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            examples/*/go.mod
      - name: Test taskctl
        run: go test -race -count=1 -timeout=15m ./...
      - name: Test example projects
        run: |
          for module in examples/ledger examples/textstats; do
            (cd "$module" && go test -race -count=1 -timeout=5m ./...)
          done
      - name: Vet all modules
        run: |
          go vet ./...
          for module in examples/ledger examples/textstats; do
            (cd "$module" && go vet ./...)
          done

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build and package
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -buildvcs=false -trimpath -ldflags='-s -w' -o dist/taskctl ./cmd/taskctl
          tar -czf "taskctl-${GOOS}-${GOARCH}.tar.gz" -C dist taskctl
      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: taskctl-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14
